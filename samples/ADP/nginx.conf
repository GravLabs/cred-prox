events {}

http {
  # One line per request naming the verified client certificate and the path — the
  # upstream's own log proves which certificate arrived on the token hop vs the API hop.
  log_format subject '$ssl_client_s_dn | $request';
  access_log /dev/stdout subject;

  server {
    listen 443 ssl;

    ssl_certificate         /etc/nginx/pki/server.crt;
    ssl_certificate_key     /etc/nginx/pki/server.key;

    # Require a client cert signed by the sample CA on every hop.
    ssl_verify_client       on;
    ssl_client_certificate  /etc/nginx/pki/ca.crt;

    # No keepalive: every request is a fresh handshake, so a rotated client certificate
    # is visible on the very next request (the Key Vault rotation witness relies on this).
    keepalive_timeout 0;

    # The original implementation fronts two hosts (accounts.adp.com for the token call,
    # api.adp.com for the API); the stub collapses them onto one by path.
    location /auth/ {
      proxy_pass http://wiremock:8080;
      proxy_set_header X-Client-DN "$ssl_client_s_dn";
    }

    location /api/ {
      proxy_pass http://wiremock:8080;
      proxy_set_header X-Client-DN "$ssl_client_s_dn";
    }
  }
}
