services:
  wiremock:
    image: wiremock/wiremock:3.9.2
    ports:
      - "8081:8080"
    command: ["--global-response-templating"]
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro

  # Loopback Azure Key Vault stub for the offline rotation witness (--kv-smoke).
  # The list mapping is static; the secret mapping is (re)installed at run time by
  # rotate-kv-stub.sh from the generated PFX bundles.
  wiremock-kv:
    image: wiremock/wiremock:3.9.2
    ports:
      - "8082:8080"
    volumes:
      - ./wiremock-kv/mappings:/home/wiremock/mappings:ro

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8443:443"
    volumes:
      - ./certs:/etc/nginx/pki:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - wiremock
    command: ["nginx", "-g", "daemon off;"]
