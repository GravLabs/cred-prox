events {}

http {
  server {
    listen 443 ssl;

    ssl_certificate         /etc/nginx/pki/server.crt;
    ssl_certificate_key     /etc/nginx/pki/server.key;

    # Require a client cert signed by the sample CA, and echo its subject back — the
    # upstream itself proves which certificate CredProx presented.
    ssl_verify_client       on;
    ssl_client_certificate  /etc/nginx/pki/ca.crt;

    location / {
      return 200 "$ssl_client_s_dn\n";
    }
  }
}
