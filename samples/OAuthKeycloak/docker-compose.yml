services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_PASSWORD: admin
    ports:
      - "5103:8080"
    volumes:
      - ./realm:/opt/keycloak/data/import:ro

  api:
    image: credprox-oauthkeycloak-stubapi
    build:
      context: ../..
      dockerfile: samples/OAuthKeycloak/StubApi/Dockerfile
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
    depends_on:
      - keycloak
    ports:
      - "5082:8080"

  proxy:
    image: credprox-oauthkeycloak-sample
    build:
      context: ../..
      dockerfile: samples/OAuthKeycloak/Dockerfile
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
    depends_on:
      - keycloak
      - api
    ports:
      - "5099:8080"
