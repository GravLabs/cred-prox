services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_PASSWORD: admin
    ports:
      - "5093:8080"
    volumes:
      - ./realm:/opt/keycloak/data/import:ro

  api:
    image: credprox-percaller-stubapi
    build:
      context: ../..
      dockerfile: samples/PerCallerCredentials/StubApi/Dockerfile
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
    depends_on:
      - keycloak
    ports:
      - "5084:8080"

  proxy:
    image: credprox-percaller-sample
    build:
      context: ../..
      dockerfile: samples/PerCallerCredentials/Dockerfile
    environment:
      ASPNETCORE_URLS: http://0.0.0.0:8080
    depends_on:
      - keycloak
      - api
    ports:
      - "5100:8080"
