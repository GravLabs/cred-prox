# GitHub Actions CI. ubuntu-latest (Docker is preinstalled for the container jobs).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    name: Build, test and coverage
    runs-on: ubuntu-latest
    # Measured 160 s (green run 44213003116, attempt 1); bound ~4x.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fuzz target homes agree
        run: bash tests/CredProx.Fuzz/check-targets-agree.sh

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Examples (in the solution) restore CredProx from the local package feed.
      - name: Pack packages to the local feed
        run: |
          dotnet pack src/CredProx.Abstractions -c Release -o artifacts/packages
          dotnet pack src/CredProx -c Release -o artifacts/packages
          dotnet pack src/CredProx.AzureKeyVault -c Release -o artifacts/packages
          dotnet pack src/CredProx.CallerTokens -c Release -o artifacts/packages
          dotnet pack src/CredProx.CallerKeys -c Release -o artifacts/packages
          dotnet pack src/CredProx.Hmac -c Release -o artifacts/packages
          dotnet pack src/CredProx.LoginExchange -c Release -o artifacts/packages
          dotnet pack src/CredProx.OAuth -c Release -o artifacts/packages
          dotnet pack src/CredProx.Operations -c Release -o artifacts/packages
          dotnet pack src/CredProx.Testing -c Release -o artifacts/packages

      # Runs after the local feed is populated: the solution includes the examples,
      # whose CredProx PackageReference only resolves from that feed (no public feed
      # carries CredProx), and an implicit restore is part of the scan.
      - name: Vulnerable dependency scan
        run: dotnet list CredProx.slnx package --vulnerable --include-transitive

      # Guards the Directory.Build.props SourceLink rewrite (CredProxCanonicalScmUrl):
      # a positive-only check on the canonical raw-content URL — if the rewrite ever
      # no-ops, the PDB carries a machine-local remote instead and this fails.
      # Same assertion as PUBLISHING.md.
      - name: Assert SourceLink in packed symbols
        run: |
          for pkg in artifacts/packages/*.snupkg; do
            unzip -p "$pkg" 'lib/net10.0/*.pdb' | grep -aq 'https://raw.githubusercontent.com/GravLabs/cred-prox/' \
              || { echo "SourceLink canonical URL missing in $pkg"; exit 1; }
          done

      - name: Restore
        run: dotnet restore CredProx.slnx

      - name: Build
        run: dotnet build CredProx.slnx --configuration Release --no-restore

      # The soak host lives outside the solution; building it here against the feed the
      # step above packed means a version bump cannot strand it silently.
      - name: Build the soak host
        run: dotnet build tools/m33-soak/SoakHost --configuration Release

      - name: Test with coverage
        run: >-
          dotnet test tests/CredProx.Tests/CredProx.Tests.csproj
          --configuration Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Security property tests with coverage
        run: >-
          dotnet test tests/CredProx.SecurityTests/CredProx.SecurityTests.csproj
          --configuration Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      # The built-ins and the fakes run the plugin authors' conformance suites (§5.2);
      # this run is also what puts CredProx.Testing itself under the coverage gate.
      - name: Conformance suites with coverage
        run: >-
          dotnet test tests/CredProx.ConformanceTests/CredProx.ConformanceTests.csproj
          --configuration Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Coverage gate (§5.3)
        run: python3 build/coverage-gate.py "TestResults/**/coverage.cobertura.xml"

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      - name: Generate coverage summary
        if: always()
        shell: bash
        run: |
          if ! ls TestResults/*/coverage.cobertura.xml >/dev/null 2>&1; then
            echo "No coverage file produced; skipping report generation."
            exit 0
          fi
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator \
            -reports:"TestResults/**/coverage.cobertura.xml" \
            -targetdir:coverage-report \
            -reporttypes:"Html;TextSummary;Cobertura"
          cat coverage-report/Summary.txt

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report
          if-no-files-found: ignore

  # Plan §5.1: container end-to-end tests (real Keycloak, real nginx mTLS).
  # Linux runner with Docker; the tests skip themselves where Docker is absent.
  e2e:
    name: Container end-to-end (Keycloak, nginx mTLS)
    runs-on: ubuntu-latest
    # Measured 62 s (same run); bound ~5x for container pull variance.
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore tests/CredProx.E2ETests/CredProx.E2ETests.csproj

      - name: Build
        run: dotnet build tests/CredProx.E2ETests/CredProx.E2ETests.csproj --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test tests/CredProx.E2ETests/CredProx.E2ETests.csproj
          --configuration Release --no-build

  # Plan §6: examples build against the packed packages (catching packaging mistakes) and
  # the offline-capable ones smoke against local stubs/containers.
  # The MicrosoftGraph sample builds here and its offline smoke runs below.
  examples:
    name: Examples build and smoke
    runs-on: ubuntu-latest
    # PROVISIONAL bound, to be resized from the first green public run of the
    # current shape: the green figure for this job is 619 s (run 44213003116
    # attempt 2 - attempt 1's 407 s leg FAILED mid-job), measured at the 0.12.0
    # tag. Two steps added since are its heaviest: the whole unfiltered Sample
    # Smokes project (296 s measured in a fresh tree) and the ACA harness smoke
    # (a docker build + run, unmeasured). Lower bound ~915 s sits over the old
    # 900 s cap, so 30 m; resize when a current-shape run is green.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Pack packages to the local feed
        run: |
          dotnet pack src/CredProx.Abstractions -c Release -o artifacts/packages
          dotnet pack src/CredProx -c Release -o artifacts/packages
          dotnet pack src/CredProx.AzureKeyVault -c Release -o artifacts/packages
          dotnet pack src/CredProx.CallerTokens -c Release -o artifacts/packages
          dotnet pack src/CredProx.CallerKeys -c Release -o artifacts/packages
          dotnet pack src/CredProx.Hmac -c Release -o artifacts/packages
          dotnet pack src/CredProx.LoginExchange -c Release -o artifacts/packages
          dotnet pack src/CredProx.OAuth -c Release -o artifacts/packages
          dotnet pack src/CredProx.Operations -c Release -o artifacts/packages
          dotnet pack src/CredProx.Testing -c Release -o artifacts/packages

      - name: Build all examples (Release, against the packages)
        run: |
          for p in QuickStart OAuthKeycloak MutualTls MicrosoftGraph ADP LoginExchange PerCallerCredentials GitHubApp HmacSigning CustomPlugin Operations AiGateway TokenExchange AgentEgress SessionCookie AzureContainerApps CallerApiKey AgentTokens; do
            dotnet build "samples/$p" --configuration Release
          done

      # Cross-sample guard: every host port a sample claims (compose mapping, appsettings
      # or fixture literal) must belong to exactly one sample. Cheap and offline.
      - name: Guard sample host ports
        run: samples/port-uniqueness.sh

      - name: Smoke QuickStart (WireMock)
        run: samples/QuickStart/smoke.sh

      - name: Smoke OAuthKeycloak (Keycloak)
        run: samples/OAuthKeycloak/smoke.sh

      - name: Smoke MutualTls (nginx mTLS)
        run: samples/MutualTls/smoke.sh

      - name: Smoke ADP (nginx mTLS + WireMock + offline Key Vault witness)
        run: samples/ADP/smoke.sh

      - name: Smoke PerCallerCredentials (Keycloak)
        run: samples/PerCallerCredentials/smoke.sh

      - name: Smoke GitHubApp (in-process stubs)
        run: samples/GitHubApp/smoke.sh

      - name: Smoke HmacSigning (in-process stub)
        run: samples/HmacSigning/smoke.sh

      # Conformance self-test + proxy path, both against in-process stubs.
      - name: Smoke CustomPlugin (in-process stubs)
        run: samples/CustomPlugin/smoke.sh

      # Throttling, vendor-429 pause, circuit breaker, health (shortened load script).
      - name: Smoke Operations (WireMock)
        run: samples/Operations/smoke.sh

      # Login exchange, per-environment partitions, partition allow-list (WireMock).
      - name: Smoke LoginExchange (WireMock)
        run: samples/LoginExchange/smoke.sh

      # Caller keys, injected provider key, SSE passthrough, allow-list, throttle, audit.
      - name: Smoke AiGateway (in-process provider stub)
        run: samples/AiGateway/smoke.sh

      # Token exchange against real Keycloak: per-user exchanged tokens, forged
      # inbound 401 before any exchange, caller key still required, downstream
      # audience refuses the inbound token.
      - name: Smoke TokenExchange (Keycloak)
        run: samples/TokenExchange/smoke.sh

      # Agent keys, allow-lists as tool boundaries, one shared cached session token
      # across two agents, scrubbing of the token the stub echoes back (in-process).
      - name: Smoke AgentEgress (in-process Salesforce stub)
        run: samples/AgentEgress/smoke.sh

      # Session-cookie login (Cayuse shape): form login replayed as Cookie, per-environment
      # partitions, caller cookies replaced, transparent refresh, scrubbed echo (in-process).
      - name: Smoke SessionCookie (in-process CRM stub)
        run: samples/SessionCookie/smoke.sh

      # Config-secrets path against the in-process stand-in; the live-gate harness
      # under tools/aca-live-harness (which proves the Key Vault path) is built and
      # offline-smoked as an image in the last step below — never on the host.
      - name: Smoke AzureContainerApps (in-process stubs)
        run: samples/AzureContainerApps/smoke.sh

      # Caller API keys: 401 missing == 401 wrong with no echo, key stripped upstream (WireMock).
      - name: Smoke CallerApiKey (WireMock)
        run: samples/CallerApiKey/smoke.sh

      # Agent tokens: named role admits, unlisted or absent roles 403, unlisted client and
      # stale token 401, bearer stripped before forwarding (offline OIDC stub).
      - name: Smoke AgentTokens (offline OIDC stub)
        run: samples/AgentTokens/smoke.sh

      # Entra app client credentials and the TokenCredential path, both against
      # in-process stubs (three cells in the shared smoke project).
      - name: Smoke MicrosoftGraph (in-process stubs)
        run: samples/MicrosoftGraph/smoke.sh

      # Order-dependence pass: the whole smoke project, unfiltered, in one process.
      # A single-process run starts every fixture side by side, so a stack or host
      # one fixture leaves behind for the next fails CI here instead of staying a
      # local duty. Same shape as each sample's smoke.sh minus the filter; building
      # the test project also builds the samples' vendor stub projects.
      - name: Smoke project whole (unfiltered)
        run: dotnet test tests/CredProx.SampleSmokes

      # The Azure live-gate harness's offline proof (G1): the image route the
      # harness README prescribes — the test CA needs a root trust store, so the
      # smoke runs in the image, never on the runner host. Exit 0 prints `SMOKE OK:`.
      - name: ACA harness offline proxy smoke
        run: |
          docker build -f tools/aca-live-harness/Dockerfile -t credprox-ci:smoke .
          docker run --rm credprox-ci:smoke --mode proxy --smoke
